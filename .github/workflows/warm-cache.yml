name: Warm verifier cache
# Yukon dispatches benchmark.yml on baseline and submission branches. Those runs can restore
# caches saved on the default branch but never save their own, so this workflow publishes the
# trusted build from main. Submissions hit only while main's key inputs match the benchmark's
# imported commit. Rewarm after eviction with `gh workflow run warm-cache.yml --ref main`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dune
      - dune-project
      - reference-lock.json
      - .gitmodules
      - "theories/**"
      - "verifier/**"
      - scripts/setup.sh
      - scripts/seal_verifier.py
      - scripts/test_verifier_cli.py
      - .github/workflows/warm-cache.yml
permissions:
  contents: read
concurrency:
  group: warm-verifier-cache
  cancel-in-progress: false
jobs:
  warm:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: blacksmith-32vcpu-ubuntu-2404
    # A cold setup with dune -j 1 took 6h07m on the previous guest's dev baseline run.
    timeout-minutes: 1380
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Submissions restore with the key computed in benchmark.yml; a different key here would
      # publish an entry nobody reads.
      - name: Cache key matches benchmark.yml
        run: |
          key() { grep -m1 -E '^ +key: rocq-verifier-' "$1" | sed -E 's/^ +//'; }
          test -n "$(key .github/workflows/benchmark.yml)"
          test "$(key .github/workflows/benchmark.yml)" = "$(key .github/workflows/warm-cache.yml)"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            ~/.opam
            _build
            .artifacts/verifier-seal.json
          key: rocq-verifier-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dune', 'dune-project', 'reference-lock.json', '.gitmodules', 'theories/**', 'verifier/**', 'scripts/setup.sh', 'scripts/seal_verifier.py', 'scripts/test_verifier_cli.py') }}-v1
      # Same reason as benchmark.yml: the negative CLI cases in setup run inside bwrap.
      - name: Allow Bubblewrap user namespaces
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Setup
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/setup.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.opam
            _build
            .artifacts/verifier-seal.json
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload setup logs
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: setup-logs
          include-hidden-files: true
          path: |
            .artifacts/setup/*.log
            .artifacts/setup/*.time
          if-no-files-found: ignore
